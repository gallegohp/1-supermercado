spring:
  application:
    name: supermercado
  datasource: 
    url: jdbc:mysql://localhost:3306/supermercado-maik
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:  
      hibernate:
        format-sql: true

  logging:  
    level:
      org.springframework.web: DEBUG
      org.hibernate.SQL: DEBUG
      org.hibernate.type.descriptor.sql.BasicBinder: TRACE

server:  
  servlet:
    context-path: /api/v1/supermercado